[project]
name = "wzm"
version = "0.1.0"
description = "Predictive work zone impact system: backbone"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0", "geoalchemy2>=0.14"]
ml = ["pandas>=2.2", "pyarrow>=15", "lightgbm>=4.3", "scikit-learn>=1.4", "mlflow>=2.11"]
dev = ["pytest>=8"]

[project.scripts]
wzm = "wzm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wzm = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
