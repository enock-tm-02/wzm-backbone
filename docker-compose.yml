services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wzm
      POSTGRES_PASSWORD: wzm
      POSTGRES_DB: wzm
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
